import java.util.Properties
import java.io.FileInputStream

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

// Load signing configuration from keys.properties (optional for debug builds)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keys.properties")
def ciSingleApk = project.hasProperty("ciSingleApk") && project.property("ciSingleApk").toString().toBoolean()

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.mshomeguardian.logger"
    compileSdk 35

    defaultConfig {
        applicationId "com.mshomeguardian.logger"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            if (keystorePropertiesFile.exists()) {
                def debugStoreFilePath = keystoreProperties.getProperty("debugStoreFile")
                def debugStorePasswordValue = keystoreProperties.getProperty("debugStorePassword")
                def debugKeyAliasValue = keystoreProperties.getProperty("debugKeyAlias")
                def debugKeyPasswordValue = keystoreProperties.getProperty("debugKeyPassword")

                if (debugStoreFilePath && debugStorePasswordValue && debugKeyAliasValue && debugKeyPasswordValue) {
                    storeFile file(debugStoreFilePath)
                    storePassword debugStorePasswordValue
                    keyAlias debugKeyAliasValue
                    keyPassword debugKeyPasswordValue
                }
            }
        }
        release {
            if (keystorePropertiesFile.exists()) {
                def storeFilePath = keystoreProperties.getProperty("storeFile")
                def storePasswordValue = keystoreProperties.getProperty("storePassword")
                def keyAliasValue = keystoreProperties.getProperty("keyAlias")
                def keyPasswordValue = keystoreProperties.getProperty("keyPassword")

                if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                    storeFile file(storeFilePath)
                    storePassword storePasswordValue
                    keyAlias keyAliasValue
                    keyPassword keyPasswordValue
                }
            }
        }
    }

    // ADD: APK Splitting for smaller downloads
    splits {
        abi {
            enable !ciSingleApk
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
        density {
            enable !ciSingleApk
            reset()
            include "mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"
        }
    }

    kapt {
        correctErrorTypes = true
        useBuildCache = true
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
            arg("room.incremental", "true")
        }
        javacOptions {
            option("-Xmaxerrs", 500)
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // ADDED: Additional optimizations for JNA/Vosk
            proguardFiles 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    // Apply signing config to release builds if keys.properties exists
    if (keystorePropertiesFile.exists()) {
        if (
                keystoreProperties.getProperty("debugStoreFile") &&
                keystoreProperties.getProperty("debugStorePassword") &&
                keystoreProperties.getProperty("debugKeyAlias") &&
                keystoreProperties.getProperty("debugKeyPassword")
        ) {
            buildTypes.debug.signingConfig signingConfigs.debug
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'

        // IMPORTANT: Handle JNA native libraries properly
        pickFirst 'lib/arm64-v8a/libjnidispatch.so'
        pickFirst 'lib/armeabi-v7a/libjnidispatch.so'
        pickFirst 'lib/x86/libjnidispatch.so'
        pickFirst 'lib/x86_64/libjnidispatch.so'
        pickFirst 'lib/arm64-v8a/libvosk.so'
        pickFirst 'lib/armeabi-v7a/libvosk.so'
        pickFirst 'lib/x86/libvosk.so'
        pickFirst 'lib/x86_64/libvosk.so'
        pickFirst 'lib/*/libjnidispatch.so'

        // ADDED: Exclude AWT-related files that cause issues
        exclude '**/java.awt/**'
        exclude '**/javax.swing/**'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'

    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha12'

    // Room Database
    def room_version = "2.6.0"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Coroutines
    def coroutines_version = "1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$coroutines_version"

    // Lifecycle
    def lifecycle_version = "2.6.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"

    // Firebase - OPTIMIZED: Only what we need
    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-auth'

    // Network
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    // Google Play Services - OPTIMIZED
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // FIXED: Vosk and JNA with proper version management
    implementation 'net.java.dev.jna:jna:5.9.0@aar'
    implementation('com.alphacephei:vosk-android:0.3.47') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Force resolution to avoid conflicts
configurations.all {
    resolutionStrategy {
        force 'androidx.room:room-runtime:2.6.0'
        force 'androidx.room:room-ktx:2.6.0'
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'com.google.android.material:material:1.9.0'
        force 'androidx.work:work-runtime-ktx:2.8.1'
        force 'net.java.dev.jna:jna:5.9.0'

        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

        // ADDED: Force exclude AWT classes
        exclude group: 'java.awt'
        exclude group: 'javax.swing'
    }
}